shellSecret: SECRET
shellAuthQuery: auth
server.port: 3015
server.host: 127.0.0.1
dockerConfig:
  socketPath: '/var/run/docker.sock'
  version: 'v1.44'
ssl: {}
logging:
  enabled: false
  path: /var/log/probo-shell/probo-shell.log
  period: 1d
  count: 7
operations:
  bash:
    - bash
  log.apache.access:
    - 'tail'
    - '-F'
    - '/var/log/apache2/access.log'
  log.apache.error:
    - 'tail'
    - '-F'
    - '/var/log/apache2/error.log'
  log.mysql.error:
    - 'tail'
    - '-F'
    - '/var/log/mysql/error.log'
  log.drupal.watchdog:
    - 'drush'
    - '--root=/var/www/html'
    - 'watchdog-show'
    - '--full'
    - '--extended'
    - '--tail'
  log.php.error:
    - 'tail'
    - '-F'
    - '/var/log/php/error.log'
sanitizeStrings:
  - pattern: 'probo-container-[\w|\d]*:'
    replacement: 'probo-shell:'
  - pattern: '127.0.0.1(:\d*)'
